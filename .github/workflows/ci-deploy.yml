name: CI and deploy

# Every push and pull request runs the checks. Only a push to main that passes
# them deploys to production. The deploy job never runs for pull requests
# (this repository is public: fork PRs must never see secrets).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only values; nothing here is a real credential.
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      ALLOWED_HOSTS: localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/development.txt
      - name: Lint
        run: ruff check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest -p no:cacheprovider

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deploys must not overlap and must never be cancelled half way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: api.paise-kuthe-gele.com
      DEPLOY_USER: ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Repository secret DEPLOY_SSH_KEY is not set. See docs/DEPLOY.md, section CI/CD."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host key pinned in the repository (deploy/known_hosts): no
          # trust-on-first-use, so a network attacker cannot impersonate the VM.
          cp deploy/known_hosts ~/.ssh/known_hosts

      - name: Upload and deploy
        # The key is bound to /usr/local/bin/budget-deploy on the VM: it reads
        # this tar from stdin, builds, migrates and restarts. It cannot open a
        # shell. Any command given here is ignored by the server.
        run: |
          git archive --format=tar HEAD | ssh \
            -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy

      - name: Verify the live site
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 5 --retry-all-errors \
            "https://$DEPLOY_HOST/healthz/"
