openapi: 3.0.3
info:
  title: Personal Budget API
  version: 1.0.0
  description: Multi-user personal budget management API
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: 'Returns a short-lived `access` token (60 minutes) and a `refresh`
        token (7 days). Send `Authorization: Bearer <access>` on every other request.
        Limited to 5 requests/minute per IP.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
            example:
              email: asha@example.com
              password: S3cure-pass!
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
            example:
              email: asha@example.com
              password: S3cure-pass!
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
            example:
              email: asha@example.com
              password: S3cure-pass!
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Wrong credentials, or the token is invalid/expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Too many requests; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Log in
      security: []
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Revokes the refresh token. Discard both tokens on the device afterwards.
        No Authorization header is needed.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
            example:
              refresh: <refresh>
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
            example:
              refresh: <refresh>
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
            example:
              refresh: <refresh>
        required: true
      responses:
        '200':
          description: No response body
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Wrong credentials, or the token is invalid/expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Log out (revoke refresh token)
      security: []
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Creates the account and seeds 49 default categories. `timezone`
        must be an IANA name (e.g. `Asia/Kolkata`, default `UTC`) and decides what
        "today" means for recurring entries. A taken email returns a generic 400 on
        purpose. Limited to 5 requests/minute per IP.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            example:
              email: asha@example.com
              password: S3cure-pass!
              first_name: Asha
              last_name: Patil
              timezone: Asia/Kolkata
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            example:
              email: asha@example.com
              password: S3cure-pass!
              first_name: Asha
              last_name: Patil
              timezone: Asia/Kolkata
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            example:
              email: asha@example.com
              password: S3cure-pass!
              first_name: Asha
              last_name: Patil
              timezone: Asia/Kolkata
        required: true
      security: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '429':
          description: Too many requests; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Register
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: 'Refresh tokens **rotate**: the response contains a NEW `refresh`
        token and the one you sent is revoked. Always store the new one. A 401 here
        means the user must log in again.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
            example:
              refresh: <refresh>
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
            example:
              refresh: <refresh>
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
            example:
              refresh: <refresh>
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Wrong credentials, or the token is invalid/expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Refresh access token
      security: []
  /api/balance/:
    get:
      operationId: balance_retrieve
      description: '`opening`/`closing` are null when no initial balance is set or
        the month is before it. Bank balance counts transactions only, never credit-card
        entries.'
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: Budget month as YYYY-MM (or YYYY-MM-DD, normalised to the 1st).
          Defaults to the current month.
      tags:
      - balance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSummary'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Get bank and emergency-fund balance for a month
  /api/categories/:
    get:
      operationId: categories_list
      description: 'Returns a plain JSON array (not paginated) of the user''s active
        categories. `planned_amount` is the planned amount in effect for `?month=`
        (default: current month).'
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: Budget month as YYYY-MM (or YYYY-MM-DD, normalised to the 1st).
          Defaults to the current month.
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: List categories
    post:
      operationId: categories_create
      description: Expense categories require `group` (`needs`, `wants`, `investment`,
        `other`); income categories must NOT have a group. Names are unique among
        the user's active categories of the same type.
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
            example:
              name: Groceries
              category_type: expense
              group: needs
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
            example:
              name: Groceries
              category_type: expense
              group: needs
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
            example:
              name: Groceries
              category_type: expense
              group: needs
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Create category
  /api/categories/{id}/:
    get:
      operationId: categories_retrieve
      description: ''
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      - in: query
        name: month
        schema:
          type: string
        description: Budget month as YYYY-MM (or YYYY-MM-DD, normalised to the 1st).
          Defaults to the current month.
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Not found (or not the user's).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Get category
    put:
      operationId: categories_update
      description: ''
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
            example:
              name: Groceries
              category_type: expense
              group: needs
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
            example:
              name: Groceries
              category_type: expense
              group: needs
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
            example:
              name: Groceries
              category_type: expense
              group: needs
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Not found (or not the user's).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Replace category (PUT)
    patch:
      operationId: categories_partial_update
      description: '`category_type` cannot be changed once the category has transactions,
        planned amounts or recurring entries (400). Renaming and moving between groups
        is always allowed.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
            example:
              name: Groceries & Staples
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
            example:
              name: Groceries & Staples
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
            example:
              name: Groceries & Staples
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Not found (or not the user's).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Update category (PATCH)
    delete:
      operationId: categories_destroy
      description: 'Soft delete: history is kept. Returns 400 (body is a JSON array
        with one message) while an active recurring entry uses the category.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Not found (or not the user's).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Delete category
  /api/credit-card-entries/:
    get:
      operationId: credit_card_entries_list
      description: Paginated and limited to one month (`?month=`, default current),
        optionally to one card (`?card=<id>`). Response is `{count, next, previous,
        results}`.
      parameters:
      - in: query
        name: card
        schema:
          type: integer
        description: Only entries on this credit card id.
      - in: query
        name: month
        schema:
          type: string
        description: Budget month as YYYY-MM (or YYYY-MM-DD, normalised to the 1st).
          Defaults to the current month.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - credit-card-entries
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreditCardEntryList'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: List credit card entries
    post:
      operationId: credit_card_entries_create
      description: '`card` must be one of the user''s active cards. Entries never
        affect the bank balance.'
      tags:
      - credit-card-entries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCardEntryRequest'
            example:
              card: 1
              amount: '1299.00'
              date: '2026-03-12'
              description: Online shopping
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreditCardEntryRequest'
            example:
              card: 1
              amount: '1299.00'
              date: '2026-03-12'
              description: Online shopping
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreditCardEntryRequest'
            example:
              card: 1
              amount: '1299.00'
              date: '2026-03-12'
              description: Online shopping
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardEntry'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Create credit card entry
  /api/credit-card-entries/{id}/:
    get:
      operationId: credit_card_entries_retrieve
      description: ''
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credit card entry.
        required: true
      tags:
      - credit-card-entries
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardEntry'
          description: ''
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Not found (or not the user's).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Get credit card entry
    put:
      operationId: credit_card_entries_update
      description: ''
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credit card entry.
        required: true
      tags:
      - credit-card-entries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCardEntryRequest'
            example:
              card: 1
              amount: '1299.00'
              date: '2026-03-12'
              description: Online shopping
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreditCardEntryRequest'
            example:
              card: 1
              amount: '1299.00'
              date: '2026-03-12'
              description: Online shopping
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreditCardEntryRequest'
            example:
              card: 1
              amount: '1299.00'
              date: '2026-03-12'
              description: Online shopping
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardEntry'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Not found (or not the user's).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Replace credit card entry (PUT)
    patch:
      operationId: credit_card_entries_partial_update
      description: ''
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credit card entry.
        required: true
      tags:
      - credit-card-entries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCreditCardEntryRequest'
            example:
              amount: '999.00'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCreditCardEntryRequest'
            example:
              amount: '999.00'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCreditCardEntryRequest'
            example:
              amount: '999.00'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardEntry'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Not found (or not the user's).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Update credit card entry (PATCH)
    delete:
      operationId: credit_card_entries_destroy
      description: ''
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credit card entry.
        required: true
      tags:
      - credit-card-entries
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Not found (or not the user's).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Delete credit card entry
  /api/credit-cards/:
    get:
      operationId: credit_cards_list
      description: 'Plain array of active cards. `actual_amount` is the spend on the
        card in `?month=` (default: current month).'
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: Budget month as YYYY-MM (or YYYY-MM-DD, normalised to the 1st).
          Defaults to the current month.
      tags:
      - credit-cards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditCard'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: List credit cards
    post:
      operationId: credit_cards_create
      description: ''
      tags:
      - credit-cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCardRequest'
            example:
              name: HDFC Millennia
              planned_amount: '15000.00'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreditCardRequest'
            example:
              name: HDFC Millennia
              planned_amount: '15000.00'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreditCardRequest'
            example:
              name: HDFC Millennia
              planned_amount: '15000.00'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCard'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Create credit card
  /api/credit-cards/{id}/:
    get:
      operationId: credit_cards_retrieve
      description: ''
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credit card.
        required: true
      - in: query
        name: month
        schema:
