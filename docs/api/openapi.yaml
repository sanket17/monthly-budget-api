          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTransactionRequest'
            example:
              amount: '475.00'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTransactionRequest'
            example:
              amount: '475.00'
      security:
      - jwtAuth: []
      responses:
        '200':
