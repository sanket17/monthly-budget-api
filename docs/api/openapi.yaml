  /api/users/me/:
    get:
      operationId: users_me_retrieve
      description: |-
        GET/PATCH /api/users/me/

        Returns or updates the authenticated user's own profile.
        Scoped strictly to request.user — no user ID in the URL
        (prevents BOLA: attacker cannot substitute another user's ID).
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Get my profile
    patch:
      operationId: users_me_partial_update
      description: |-
        GET/PATCH /api/users/me/

        Returns or updates the authenticated user's own profile.
        Scoped strictly to request.user — no user ID in the URL
        (prevents BOLA: attacker cannot substitute another user's ID).
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
            example:
              first_name: Asha
              last_name: Patil
              timezone: Asia/Kolkata
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
            example:
              first_name: Asha
              last_name: Patil
              timezone: Asia/Kolkata
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
            example:
              first_name: Asha
              last_name: Patil
              timezone: Asia/Kolkata
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Missing, invalid or expired access token. Refresh it, or log
            in again if refresh also fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Update my profile
components:
  schemas:
    BalanceSnapshot:
      type: object
      description: |-
        Response shape of one balance walk (schema only, never validates input).
        Both values are null when no InitialBalance anchor applies to the month.
      properties:
        opening:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        closing:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
      required:
      - closing
      - opening
    BalanceSummary:
      type: object
      description: Response of GET /api/balance/ (schema only).
      properties:
        month:
          type: string
          format: date
        bank_balance:
          $ref: '#/components/schemas/BalanceSnapshot'
        emergency_fund_balance:
          $ref: '#/components/schemas/BalanceSnapshot'
      required:
      - bank_balance
      - emergency_fund_balance
      - month
    BalanceTypeEnum:
      enum:
      - bank
      - emergency_fund
      type: string
      description: |-
        * `bank` - Bank
        * `emergency_fund` - Emergency Fund
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        category_type:
          $ref: '#/components/schemas/CategoryTypeEnum'
        group:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/GroupEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_active:
          type: boolean
          readOnly: true
        planned_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - category_type
      - id
      - is_active
      - name
      - planned_amount
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category_type:
          $ref: '#/components/schemas/CategoryTypeEnum'
        group:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/GroupEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - category_type
      - name
    CategoryTypeEnum:
      enum:
      - expense
      - income
      type: string
      description: |-
        * `expense` - Expense
        * `income` - Income
    CreditCard:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        planned_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_active:
          type: boolean
          readOnly: true
        actual_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - actual_amount
      - id
      - is_active
      - name
      - planned_amount
    CreditCardEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        card:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - card
      - created_at
      - date
      - description
      - id
    CreditCardEntryRequest:
      type: object
      properties:
        card:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - amount
      - card
      - date
      - description
    CreditCardRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        planned_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - name
      - planned_amount
    Dashboard:
      type: object
      properties:
        month:
          type: string
          format: date
        bank_balance:
          $ref: '#/components/schemas/BalanceSnapshot'
        emergency_fund_balance:
          $ref: '#/components/schemas/BalanceSnapshot'
        savings:
          $ref: '#/components/schemas/Savings'
        expense_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseBreakdownItem'
        expense_totals:
          $ref: '#/components/schemas/PlannedActual'
        income_totals:
          $ref: '#/components/schemas/PlannedActual'
        credit_card_totals:
          $ref: '#/components/schemas/PlannedActual'
      required:
      - bank_balance
      - credit_card_totals
      - emergency_fund_balance
      - expense_breakdown
      - expense_totals
      - income_totals
      - month
      - savings
    ExpenseBreakdownItem:
      type: object
      properties:
        group:
          $ref: '#/components/schemas/GroupEnum'
        actual:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        planned:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        percent_of_actual:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,20})?$
          nullable: true
        percent_of_planned:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,20})?$
          nullable: true
      required:
      - actual
      - group
      - percent_of_actual
      - percent_of_planned
      - planned
    GroupEnum:
      enum:
      - needs
      - wants
      - investment
      - other
      type: string
      description: |-
        * `needs` - Needs
        * `wants` - Wants
        * `investment` - Investment
        * `other` - Other
    InitialBalance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        balance_type:
          $ref: '#/components/schemas/BalanceTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        effective_month:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - balance_type
      - created_at
      - effective_month
      - id
    InitialBalanceRequest:
      type: object
      properties:
        balance_type:
          $ref: '#/components/schemas/BalanceTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        effective_month:
          type: string
          format: date
      required:
      - amount
      - balance_type
      - effective_month
    NullEnum:
      enum:
      - null
    PaginatedCreditCardEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CreditCardEntry'
    PaginatedTransactionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
    PatchedCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category_type:
          $ref: '#/components/schemas/CategoryTypeEnum'
        group:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/GroupEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
    PatchedCreditCardEntryRequest:
      type: object
      properties:
        card:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 255
    PatchedCreditCardRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        planned_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
    PatchedRecurringEntryRequest:
      type: object
      properties:
        category:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        description:
          type: string
          minLength: 1
          maxLength: 255
        day_of_month:
          type: integer
          maximum: 31
          minimum: 1
    PatchedTransactionRequest:
      type: object
      properties:
        category:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 255
    PatchedUserProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    PlannedActual:
      type: object
      properties:
        planned:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        actual:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - actual
      - planned
    PlannedAmount:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        effective_from:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - category
      - created_at
      - effective_from
      - id
    PlannedAmountRequest:
      type: object
      properties:
        category:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        effective_from:
          type: string
          format: date
      required:
      - amount
      - category
      - effective_from
    RecurringEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        description:
          type: string
          maxLength: 255
        day_of_month:
          type: integer
          maximum: 31
          minimum: 1
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - category
      - created_at
      - day_of_month
      - description
      - id
      - is_active
    RecurringEntryRequest:
      type: object
      properties:
        category:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        description:
          type: string
          minLength: 1
          maxLength: 255
        day_of_month:
          type: integer
          maximum: 31
          minimum: 1
      required:
      - amount
      - category
      - day_of_month
      - description
    Registration:
      type: object
      description: |-
        Serializer for user registration.

        Security note: validate_email uses a generic error message to prevent
        user enumeration (ASVS Level 1 — attacker cannot tell if email is registered).
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        timezone:
          type: string
          maxLength: 64
      required:
      - email
      - id
    RegistrationRequest:
      type: object
      description: |-
        Serializer for user registration.

        Security note: validate_email uses a generic error message to prevent
        user enumeration (ASVS Level 1 — attacker cannot tell if email is registered).
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        timezone:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - email
      - password
    Savings:
      type: object
      properties:
        start_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        end_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,20})?$
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
      required:
      - amount
      - end_balance
      - percentage
      - start_balance
    TokenBlacklistRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 255
        recurring_entry:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - category
      - created_at
      - date
      - description
      - id
      - recurring_entry
    TransactionRequest:
      type: object
      properties:
        category:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - amount
      - category
      - date
      - description
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        timezone:
          type: string
          maxLength: 64
      required:
      - email
      - id
    ErrorDetail:
      type: object
      description: Used for 401, 403, 404 and 429 responses.
      properties:
        detail:
          type: string
          example: Not found.
        code:
          type: string
          description: Present on token errors, e.g. `token_not_valid`.
          example: token_not_valid
      required:
      - detail
    ValidationErrors:
      type: object
      description: 400 body. Keys are field names; each value is a list of messages
        (sometimes a single string, e.g. for an invalid `month` query). A few 400s
        return a bare JSON array of messages instead, so a client should accept all
        three shapes.
      additionalProperties:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      example:
        amount:
        - Amount must be greater than zero.
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: https://api.paise-kuthe-gele.com
  description: Production
- url: http://localhost:8000
  description: Local development
tags:
- name: auth
  x-displayName: Auth
  description: Register, log in, refresh and revoke JWT tokens.
- name: users
  x-displayName: Users
  description: The signed-in user's own profile.
- name: categories
  x-displayName: Categories
  description: Expense and income categories. 49 defaults are created at registration.
- name: planned-amounts
  x-displayName: Planned amounts
  description: Monthly budget per category. Append-only; carries forward month to
    month.
- name: transactions
  x-displayName: Transactions
  description: Individual income and expense records, listed one calendar month at
    a time.
- name: initial-balances
  x-displayName: Initial balances
  description: Starting bank / emergency-fund balance that the running balances grow
    from.
- name: balance
  x-displayName: Balance
  description: Opening and closing balances for a month.
- name: credit-cards
  x-displayName: Credit cards
  description: Credit cards with a planned monthly amount and the actual spend per
    month.
