# Production stack for a single VM: Django (gunicorn) behind Caddy (auto
# HTTPS). The database is external (Supabase) - there is no db service.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Reads ./.env (see .env.production.example). DOMAIN is the public hostname.
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
